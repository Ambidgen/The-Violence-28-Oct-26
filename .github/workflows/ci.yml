# The Violence: the release gate. Active since 2026-10-28 (EA_TASKS P0.A3); it
# used to sit in tools/ci/ci.yml because the account that pushed it could not
# write workflow files.
#
# Until now every suite in tests/ was run by hand from the README, and the
# changelog's own history ("pending first run", "no Godot binary could run
# here") is what that costs: a whole feature pass landed unverified. This runs
# the static audit and the quick gate tier on both engines the project claims
# to support, and the full tier on main.
#
# The engine is downloaded from the official godotengine/godot release, which
# is reachable from GitHub-hosted runners. Nothing else is installed: the game
# has no package dependencies, and the harnesses are plain GDScript run with
# `-s`.
name: ci

on:
  push:
    # main is the release gate. arena/* is the working branch: its push run is what
    # gives the balance job its two-seed pilot (the pull_request run cannot -- see the
    # job's `if`, which needs a push event to tell a pilot from a pull request).
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: "Test tier to run (balance = the Gate 1 matrix, EA_TASKS P1.A)"
        type: choice
        default: quick
        options: [check, quick, full, balance]
      seeds:
        description: "Balance matrix: how many seeds (each plays 4 policies, 40 weeks)"
        type: string
        default: "20"
  schedule:
    # The balance matrix weekly, so a drift in the run layer is noticed without a
    # release. Monday 04:00 UTC. Results are the artifact of the `balance` job.
    - cron: "0 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No engine needed: bracket balance, duplicate members, tab-only
      # indentation, the `:=` constructs 4.7 rejects, and stray class-scope
      # statements. Catches the class of fault that made v1.2.1 unparseable.
      - name: gd47_check
        run: python3 tools/gd47_check.py
      - name: test runner regression tests
        # tools/run_tests.sh itself: exit codes, xfail/xpass, timeouts, ~ in GODOT
        run: python3 -m unittest discover -s tests -p test_runner.py -v
      - name: version metadata is in sync
        run: |
          python3 tools/sync_version.py --check || {
            echo "::error::scripts/version.gd, project.godot and export_presets.cfg disagree. Run python3 tools/sync_version.py and commit all three."
            exit 1
          }

  headless:
    name: headless (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: "4.7.2-stable"
            tier: quick
          # The engine the shipped Windows exe is built on. Kept in the matrix
          # so a 4.7-only construct cannot reach a release.
          - engine: "4.4.1-stable"
            tier: quick
    env:
      GODOT_VERSION: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v4

      - name: cache the engine
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ matrix.engine }}

      - name: install Godot ${{ matrix.engine }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o /tmp/godot.zip "$url"
          unzip -q -o /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot || true
          chmod +x ~/godot/godot

      - name: engine version
        run: ~/godot/godot --version

      - name: import the project
        # The first headless run builds .godot/ (the import cache); doing it
        # explicitly keeps its output out of the test logs.
        run: ~/godot/godot --headless --path . --import || true

      - name: headless suites
        # $HOME, not ~: a ~ inside an env value is not expanded, and the runner
        # used to stop with "no Godot binary" before running anything.
        run: GODOT="$HOME/godot/godot" tools/run_tests.sh --${{ github.event.inputs.tier || matrix.tier }}

      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.engine }}
          path: build/test-logs/
          if-no-files-found: ignore

  balance:
    # The Gate 1 matrix (EA_TASKS P1.A2/P1.A4): every policy plays whole campaigns,
    # one process per run, and the summary + per-run JSON come back as an artifact.
    # Not part of the commit gate: it is tens of minutes to hours. It runs
    #   - on demand (Actions -> ci -> Run workflow, tier=balance, seeds=N),
    #   - weekly (schedule), and
    #   - on a push to an arena/* branch, as a two-seed pilot: enough to prove the
    #     harness end to end and to see the shape of the run layer on a real engine.
    name: balance matrix
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tier == 'balance') ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/'))
    runs-on: ubuntu-latest
    timeout-minutes: 300
    # The evidence has to live in the repository: the artifact is only downloadable
    # from the run page, and this project's record of a cycle is tests/results/.
    permissions:
      contents: write
    env:
      SEEDS: ${{ github.event.inputs.seeds || (github.event_name == 'push' && '2' || '20') }}
    steps:
      - uses: actions/checkout@v4
      - name: cache the engine
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.7.2-stable
      - name: install Godot 4.7.2-stable
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v4.7.2-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
      - name: import the project
        run: ~/godot/godot --headless --path . --import || true
      - name: balance matrix
        # One process per seed x policy, each with its own XDG_DATA_HOME (the harness
        # does that itself). Report-only bands until P1.I, so this job's colour is
        # "the runs finished", not "the game is balanced" — read report.md.
        run: |
          ~/godot/godot --headless --path . -s res://tests/rogue_balance_test.gd -- \
            --seeds="$SEEDS" --policy=all --weeks=40 --jobs=4 --json=build/balance
      - name: upload the matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-${{ github.run_id }}
          path: build/balance/
          # The per-run user:// folders are scratch, not evidence.
          # (report.md, summary.json and run-*.json are what matter.)
          if-no-files-found: warn
      - name: keep the report in the repository
        # The artifact dies with the run; the cycle evidence does not. A dispatched
        # matrix is the baseline (P1.A4), an arena/* push is the pilot -- and the
        # commit is tagged [skip ci] so that the evidence does not start another
        # forty-minute matrix.
        if: >-
          (github.event_name == 'workflow_dispatch' && github.event.inputs.tier == 'balance') ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/'))
        env:
          DEST: ${{ github.event_name == 'workflow_dispatch' && 'tests/results/cycle-1A/baseline' || 'tests/results/cycle-1A/pilot' }}
        run: |
          set -euo pipefail
          mkdir -p "$DEST"
          cp build/balance/report.md "$DEST/report.md"
          cp build/balance/summary.json "$DEST/summary.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then
            echo "the matrix has not changed since the last commit"
            exit 0
          fi
          git commit -m "balance: $DEST [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

  full:
    # The simulation and campaign suites, on main and on demand only: they run
    # dozens of seeded fights each and are the slow half of the suite.
    name: full tier
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cache the engine
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.7.2-stable
      - name: install Godot 4.7.2-stable
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v4.7.2-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
      - name: import the project
        run: ~/godot/godot --headless --path . --import || true
      - name: full suites
        # $HOME, not ~: a ~ inside an env value is not expanded, and the runner
        # used to stop with "no Godot binary" before running anything.
        run: GODOT="$HOME/godot/godot" tools/run_tests.sh --full
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-full
          path: build/test-logs/
          if-no-files-found: ignore
